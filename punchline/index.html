<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Punchline</title>
<meta name="description" content="Smart time clock and job profitability tracker for lawn-care crews.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punchline">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="icon" href="./icon-512.png" sizes="512x512">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Reusable SVG symbols (inline so nothing is fetched at runtime) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 1.9"></path>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle>
    </symbol>
    <symbol id="i-money" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18"></path><path d="M16.5 7.2c-.9-1.1-2.4-1.7-4.2-1.7-2.5 0-4.1 1.2-4.1 3 0 4.3 8.8 2.2 8.8 6.5 0 1.9-1.8 3.2-4.5 3.2-2 0-3.7-.7-4.7-1.9"></path>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19V9M10 19V5M16 19v-7M22 19v-4"></path>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 14.5a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.4a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.2.62.77 1.05 1.42 1.06H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.03z"></path>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5l7 7-7 7"></path>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"></path>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"></path>
    </symbol>
  </defs>
</svg>

<div id="app">

  <header class="appbar">
    <button class="iconbtn" id="backBtn" type="button" hidden aria-label="Back">
      <svg aria-hidden="true"><use href="#i-back"></use></svg>
    </button>
    <h1 id="viewTitle">Clock<span class="sub" id="viewSub">Punchline</span></h1>
    <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings">
      <svg aria-hidden="true"><use href="#i-gear"></use></svg>
    </button>
  </header>

  <main>
    <section id="view-clock"    class="view" aria-label="Clock"></section>
    <section id="view-shifts"   class="view" aria-label="Shifts"   hidden></section>
    <section id="view-jobs"     class="view" aria-label="Jobs"     hidden></section>
    <section id="view-money"    class="view" aria-label="Money"    hidden></section>
    <section id="view-insights" class="view" aria-label="Insights" hidden></section>
    <section id="view-settings" class="view" aria-label="Settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/clock"    data-tab="clock"><svg aria-hidden="true"><use href="#i-clock"></use></svg>Clock</a>
    <a href="#/shifts"   data-tab="shifts"><svg aria-hidden="true"><use href="#i-list"></use></svg>Shifts</a>
    <a href="#/jobs"     data-tab="jobs"><svg aria-hidden="true"><use href="#i-pin"></use></svg>Jobs</a>
    <a href="#/money"    data-tab="money"><svg aria-hidden="true"><use href="#i-money"></use></svg>Money</a>
    <a href="#/insights" data-tab="insights"><svg aria-hidden="true"><use href="#i-spark"></use></svg>Insights</a>
  </nav>
</div>

<!-- Live region for the running timer, announced politely -->
<div id="a11yTimer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Modal sheet host (sheets are created here at runtime and can stack) -->
<div class="scrim" id="scrim" hidden></div>

<!-- Toast host -->
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>

<script src="./app.js"></script>
</body>
</html>
